<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - AC2FL Aero Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="css/index.css" rel="stylesheet">
</head>
<body class="page-contact">

<nav class="navbar navbar-expand-lg navbar-dark bg-black bg-opacity-75 py-3">
    <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
        <a class="navbar-brand d-flex align-items-center m-0" href="index.html">
            <img src="img/acfl_logo.png" alt="acfl logo" class="logo-acfl">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-center" id="navContent">
            <ul class="navbar-nav align-items-lg-center gap-lg-4">
                <li class="nav-item"><a class="nav-link text-white fs-4" href="index.html">Nos activités</a></li>
                <li class="nav-item"><a class="nav-link text-white fs-4" href="#">Galerie</a></li>
                <li class="nav-item"><a class="nav-link text-white fs-4" href="moyens-pedagogiques.html">Moyens pédagogiques</a></li>
                <li class="nav-item">
                    <a class="nav-link d-flex align-items-center text-white fs-4" href="contact.html">
                        <i class="fa-solid fa-circle-user me-2"></i>Contact
                    </a>
                </li>
            </ul>
        </div>

        <div class="d-none d-lg-block espace-navigation"></div>
    </div>
</nav>

<main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center px-3 py-5">
    <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <section class="formulaire-contact bg-dark bg-opacity-75 border border-light border-opacity-50 rounded-3 shadow-lg px-4 px-md-5 py-4 py-md-5 text-white">
            <h1 class="text-center fs-1 fw-light mb-5">Contact</h1>

            <form action="#" method="post">
                <div class="mb-4">
                    <label for="nom" class="visually-hidden">Nom</label>
                    <input type="text" class="form-control form-control-lg bg-transparent text-white border-light border-opacity-75 py-2" id="nom" name="nom" placeholder="Nom" required>
                </div>

                <div class="mb-4">
                    <label for="email" class="visually-hidden">Email</label>
                    <input type="email" class="form-control form-control-lg bg-transparent text-white border-light border-opacity-75 py-2" id="email" name="email" placeholder="Email" required>
                </div>

                <div class="mb-5">
                    <label for="message" class="visually-hidden">Message</label>
                    <textarea class="form-control form-control-lg bg-transparent text-white border-light border-opacity-75 py-2" id="message" name="message" rows="6" placeholder="Ecrivez votre message ici..." required></textarea>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-lg px-5 shadow-sm">Envoyer</button>
                </div>
            </form>
        </section>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrVfXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
